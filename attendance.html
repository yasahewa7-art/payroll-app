<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Attendance - Payroll App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-dark-custom { background-color: #0f172a; color: white; }
        .btn-custom { border-radius: 6px; font-weight: 500; }
        @media print {
            .no-print { display: none !important; }
            .card { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- Header -->
    <div class="card header-bg p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h2 class="fw-bold mb-1"><i class="fa-solid fa-calendar-days me-2"></i>Monthly Attendance Management</h2>
                <p class="mb-0 text-light opacity-75">Matara & Weligama Branches</p>
            </div>
            <div class="no-print mt-3 mt-md-0 d-flex gap-2">
                <a href="index.html" class="btn btn-outline-light btn-custom"><i class="fa-solid fa-arrow-left me-2"></i>Back to Registration</a>
                <button class="btn btn-primary btn-custom" onclick="window.print()"><i class="fa-solid fa-print me-2"></i>Print Attendance Sheet</button>
            </div>
        </div>
    </div>

    <!-- Attendance Form Controls -->
    <div class="card p-4 mb-4 no-print">
        <h4 class="fw-bold text-dark mb-3"><i class="fa-solid fa-clock me-2"></i>Select Details & Mark Attendance</h4>
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label fw-semibold">Select Month *</label>
                <input type="month" id="attMonth" class="form-control" onchange="loadAttendanceSheet()">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Select Employee *</label>
                <select id="attEmpSelect" class="form-select" onchange="loadAttendanceSheet()">
                    <option value="">-- Choose Employee --</option>
                </select>
            </div>
            <div class="col-md-5">
                <button class="btn btn-warning btn-custom w-100" onclick="autoFillMonth()"><i class="fa-solid fa-wand-magic-sparkles me-2"></i>Auto-Fill Full Month (8:00 - 17:30)</button>
            </div>
        </div>
    </div>

    <!-- Attendance Sheet Table -->
    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0" id="sheetTitle">Attendance Sheet</h5>
            <span class="badge bg-success fs-6" id="totalOtBadge">Total OT: 0.0 Hrs</span>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center">
                <thead class="table-dark-custom">
                    <tr>
                        <th>DATE</th>
                        <th>IN TIME</th>
                        <th>OUT TIME</th>
                        <th>STATUS</th>
                        <th>OT HOURS (After 17:30)</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                    <tr><td colspan="5" class="text-muted">කරුණාකර මාසය සහ සේවකයා තෝරන්න.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let employees = JSON.parse(localStorage.getItem('payroll_employees')) || [];
    let attendanceData = JSON.parse(localStorage.getItem('payroll_attendance')) || {};

    // Set Default Month
    document.getElementById('attMonth').value = new Date().toISOString().slice(0, 7);

    function populateEmployeeDropdown() {
        const empSelect = document.getElementById('attEmpSelect');
        empSelect.innerHTML = '<option value="">-- Choose Employee --</option>';
        
        let sortedEmployees = [...employees].sort((a, b) => a.name.localeCompare(b.name));
        sortedEmployees.forEach(emp => {
            empSelect.innerHTML += `<option value="${emp.id}">${emp.name} (${emp.id}) - ${emp.branch}</option>`;
        });
    }

    function loadAttendanceSheet() {
        const month = document.getElementById('attMonth').value;
        const empId = document.getElementById('attEmpSelect').value;
        const tbody = document.getElementById('attendanceTableBody');

        if (!month || !empId) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-muted py-4">කරුණාකර මාසය සහ සේවකයා තෝරන්න.</td></tr>';
            document.getElementById('totalOtBadge').innerText = `Total OT: 0.0 Hrs`;
            return;
        }

        const [year, m] = month.split('-');
        const daysInMonth = new Date(year, m, 0).getDate();
        const key = `${empId}_${month}`;
        
        if (!attendanceData[key]) attendanceData[key] = {};

        tbody.innerHTML = '';
        let totalOt = 0;

        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${month}-${d < 10 ? '0' + d : d}`;
            const dayRecord = attendanceData[key][dateStr] || { in: '', out: '', status: 'Present', ot: 0 };

            totalOt += parseFloat(dayRecord.ot || 0);

            tbody.innerHTML += `
                <tr>
                    <td><strong>${dateStr}</strong></td>
                    <td><input type="time" class="form-control form-control-sm text-center" value="${dayRecord.in}" onchange="updateRow('${key}', '${dateStr}', this, 'in')"></td>
                    <td><input type="time" class="form-control form-control-sm text-center" value="${dayRecord.out}" onchange="updateRow('${key}', '${dateStr}', this, 'out')"></td>
                    <td>
                        <select class="form-select form-select-sm" onchange="updateRow('${key}', '${dateStr}', this, 'status')">
                            <option value="Present" ${dayRecord.status === 'Present' ? 'selected' : ''}>Present</option>
                            <option value="Absent" ${dayRecord.status === 'Absent' ? 'selected' : ''}>Absent</option>
                            <option value="Off Day" ${dayRecord.status === 'Off Day' ? 'selected' : ''}>Off Day</option>
                        </select>
                    </td>
                    <td><span class="badge ${dayRecord.ot > 0 ? 'bg-primary' : 'bg-secondary'} fs-6">${dayRecord.ot || 0} Hrs</span></td>
                </tr>`;
        }
        document.getElementById('totalOtBadge').innerText = `Total OT: ${totalOt.toFixed(1)} Hrs`;
    }

    function autoFillMonth() {
        const month = document.getElementById('attMonth').value;
        const empId = document.getElementById('attEmpSelect').value;
        if (!month || !empId) return alert('කරුණාකර මාසය සහ සේවකයා තෝරන්න!');

        const [year, m] = month.split('-');
        const daysInMonth = new Date(year, m, 0).getDate();
        const key = `${empId}_${month}`;
        if (!attendanceData[key]) attendanceData[key] = {};

        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${month}-${d < 10 ? '0' + d : d}`;
            attendanceData[key][dateStr] = { in: '08:00', out: '17:30', status: 'Present', ot: 0 };
        }
        localStorage.setItem('payroll_attendance', JSON.stringify(attendanceData));
        loadAttendanceSheet();
    }

    function updateRow(key, dateStr, el, field) {
        if (!attendanceData[key][dateStr]) {
            attendanceData[key][dateStr] = { in: '', out: '', status: 'Present', ot: 0 };
        }
        attendanceData[key][dateStr][field] = el.value;

        // Auto Calculate OT Hours (After 17:30)
        const outTime = attendanceData[key][dateStr].out;
        if (outTime) {
            const [h, m] = outTime.split(':').map(Number);
            const outInMinutes = h * 60 + m;
            const targetInMinutes = 17 * 60 + 30; // 17:30

            if (outInMinutes > targetInMinutes) {
                const otMinutes = outInMinutes - targetInMinutes;
                attendanceData[key][dateStr].ot = (otMinutes / 60).toFixed(1);
            } else {
                attendanceData[key][dateStr].ot = 0;
            }
        }
        localStorage.setItem('payroll_attendance', JSON.stringify(attendanceData));
        loadAttendanceSheet();
    }

    // Initial Load
    populateEmployeeDropdown();
</script>

</body>
</html>
