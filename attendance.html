<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee & Payroll Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-dark-custom { background-color: #0f172a; color: white; }
        .btn-custom { border-radius: 6px; font-weight: 500; }
        @media print {
            .no-print { display: none !important; }
            .card { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- Header -->
    <div class="card header-bg p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h2 class="fw-bold mb-1"><i class="fa-solid fa-users-gear me-2"></i>Employee & Payroll Management</h2>
                <p class="mb-0 text-light opacity-75">Matara & Weligama Branches</p>
            </div>
            <div class="no-print mt-3 mt-md-0 d-flex gap-2">
                <a href="attendance.html" class="btn btn-outline-light btn-custom"><i class="fa-solid fa-calendar-days me-2"></i>Attendance Sheet</a>
                <a href="salary.html" class="btn btn-outline-light btn-custom"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Salary Payslip</a>
                <button class="btn btn-primary btn-custom" onclick="window.print()"><i class="fa-solid fa-print me-2"></i>Print Name List</button>
            </div>
        </div>
    </div>

    <!-- Form Section -->
    <div class="card p-4 mb-4 no-print">
        <h4 class="fw-bold text-dark mb-3"><i class="fa-solid fa-user-plus me-2"></i><span id="formTitle">Add New Employee Details</span></h4>
        <form id="payrollForm" onsubmit="saveEmployee(event)">
            <input type="hidden" id="editKey" value="">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Employee ID *</label>
                    <input type="text" id="empId" class="form-control" required placeholder="e.g. 1001">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Full Name *</label>
                    <input type="text" id="empName" class="form-control" required placeholder="e.g. Saman Kumara">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Branch *</label>
                    <select id="branch" class="form-select" required>
                        <option value="Matara">Matara</option>
                        <option value="Weligama">Weligama</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Bank Account Number (Optional)</label>
                    <input type="text" id="bankAcc" class="form-control" placeholder="e.g. 800123456">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">WhatsApp Number (Optional)</label>
                    <input type="text" id="whatsapp" class="form-control" placeholder="e.g. 0771234567">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Daily Basic Salary (LKR) *</label>
                    <input type="number" id="basicSalary" class="form-control" step="0.01" required value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Daily EPF Applicable Amount (LKR) (Optional)</label>
                    <input type="number" id="epfSalary" class="form-control" step="0.01" placeholder="දිනක EPF මුදල">
                </div>
                <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                    <button type="button" class="btn btn-secondary btn-custom d-none" id="cancelBtn" onclick="resetForm()">Cancel</button>
                    <button type="submit" class="btn btn-success btn-custom" id="submitBtn"><i class="fa-solid fa-floppy-disk me-2"></i>Save Details</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Table Section -->
    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-dark mb-0"><i class="fa-solid fa-list me-2"></i>Employee Records (A-Z Sorted)</h4>
            <div class="no-print">
                <select id="filterBranch" class="form-select" onchange="renderTable()">
                    <option value="All">All Branches</option>
                    <option value="Matara">Matara Branch</option>
                    <option value="Weligama">Weligama Branch</option>
                </select>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark-custom">
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>BRANCH</th>
                        <th>BANK ACCOUNT</th>
                        <th>WHATSAPP</th>
                        <th>DAILY BASIC (LKR)</th>
                        <th>DAILY EPF (LKR)</th>
                        <th class="no-print text-center">ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Firebase SDK Integrations -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // Firebase Config Options
    const firebaseConfig = {
        databaseURL: "https://rukman-payroll-default-rtdb.firebaseio.com"
    };
    
    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    const empRef = database.ref('employees');

    let employees = {};

    // Realtime Database Listener
    empRef.on('value', (snapshot) => {
        employees = snapshot.val() || {};
        renderTable();
    });

    function saveEmployee(event) {
        event.preventDefault();
        
        const id = document.getElementById('empId').value.trim();
        const name = document.getElementById('empName').value.trim();
        const branch = document.getElementById('branch').value;
        const bankAcc = document.getElementById('bankAcc').value.trim() || '-';
        const whatsapp = document.getElementById('whatsapp').value.trim() || '-';
        const basic = parseFloat(document.getElementById('basicSalary').value) || 0;
        const epfBasic = parseFloat(document.getElementById('epfSalary').value) || 0;
        const editKey = document.getElementById('editKey').value;

        const empData = { id, name, branch, bankAcc, whatsapp, basic, dailyRate: basic, epfBasic };

        if (!editKey) {
            // New Entry
            empRef.push(empData);
        } else {
            // Update Existing Record
            database.ref('employees/' + editKey).set(empData);
        }

        resetForm();
    }

    function renderTable() {
        const tbody = document.getElementById('employeeTableBody');
        const filterBranch = document.getElementById('filterBranch').value;
        tbody.innerHTML = '';

        let empList = Object.keys(employees).map(key => ({
            key: key,
            ...employees[key]
        }));

        // Sort A-Z
        empList.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

        if (filterBranch !== 'All') {
            empList = empList.filter(e => e.branch === filterBranch);
        }

        if (empList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">කිසිදු දත්තයක් ඇතුළත් කර නොමැත.</td></tr>`;
            return;
        }

        empList.forEach((emp) => {
            const basicVal = parseFloat(emp.basic || emp.dailyRate || 0);
            const epfVal = parseFloat(emp.epfBasic || 0);

            tbody.innerHTML += `
                <tr>
                    <td><strong>${emp.id || ''}</strong></td>
                    <td>${emp.name || ''}</td>
                    <td><span class="badge ${emp.branch === 'Matara' ? 'bg-primary' : 'bg-info'}">${emp.branch || ''}</span></td>
                    <td>${emp.bankAcc || '-'}</td>
                    <td>${emp.whatsapp || '-'}</td>
                    <td class="fw-semibold text-dark">${basicVal.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    <td class="fw-semibold text-primary">${epfVal.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    <td class="no-print text-center">
                        <button class="btn btn-sm btn-warning me-1" onclick="editEmployee('${emp.key}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="deleteEmployee('${emp.key}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    }

    function editEmployee(key) {
        const emp = employees[key];
        document.getElementById('empId').value = emp.id || '';
        document.getElementById('empName').value = emp.name || '';
        document.getElementById('branch').value = emp.branch || 'Matara';
        document.getElementById('bankAcc').value = emp.bankAcc === '-' ? '' : emp.bankAcc;
        document.getElementById('whatsapp').value = emp.whatsapp === '-' ? '' : emp.whatsapp;
        document.getElementById('basicSalary').value = emp.basic || emp.dailyRate || 0;
        document.getElementById('epfSalary').value = emp.epfBasic || 0;
        document.getElementById('editKey').value = key;

        document.getElementById('formTitle').innerText = 'Edit Employee Details';
        document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-arrows-rotate me-2"></i>Update Details';
        document.getElementById('cancelBtn').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEmployee(key) {
        if (confirm('ඔබට විශ්වාසද මෙම සේවක තොරතුරු ඉවත් කිරීමට අවශ්‍ය බව?')) {
            database.ref('employees/' + key).remove();
        }
    }

    function resetForm() {
        document.getElementById('payrollForm').reset();
        document.getElementById('editKey').value = '';
        document.getElementById('formTitle').innerText = 'Add New Employee Details';
        document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i>Save Details';
        document.getElementById('cancelBtn').classList.add('d-none');
    }
</script>

</body>
</html>
