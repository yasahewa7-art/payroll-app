<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Attendance & Deductions - Payroll App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-custom { border-radius: 6px; font-weight: 500; }
        .table-custom-header { background-color: #0f172a; color: white; }
        @media print {
            .no-print { display: none !important; }
            .card { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- Header -->
    <div class="card header-bg p-4 mb-4 no-print">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h2 class="fw-bold mb-1"><i class="fa-solid fa-calendar-days me-2"></i>Monthly Attendance & Deductions</h2>
                <p class="mb-0 text-light opacity-75">Matara & Weligama Branches</p>
            </div>
            <div class="d-flex gap-2 mt-3 mt-md-0">
                <a href="index.html" class="btn btn-outline-light btn-custom"><i class="fa-solid fa-arrow-left me-2"></i>Back to Registration</a>
                <a href="salary.html" class="btn btn-outline-light btn-custom"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Salary Payslip</a>
                <button class="btn btn-primary btn-custom" onclick="window.print()"><i class="fa-solid fa-print me-2"></i>Print Sheet</button>
            </div>
        </div>
    </div>

    <!-- Selection Card -->
    <div class="card p-4 mb-4">
        <h5 class="fw-bold text-dark mb-3"><i class="fa-solid filter me-2"></i>Select Month & Employee</h5>
        <div class="row g-3">
            <div class="col-md-5">
                <label class="form-label fw-semibold">Select Month *</label>
                <input type="month" id="attMonth" class="form-control" onchange="loadMonthlyData()">
            </div>
            <div class="col-md-7">
                <label class="form-label fw-semibold">Select Employee *</label>
                <select id="attEmpSelect" class="form-select" onchange="loadMonthlyData()">
                    <option value="">-- Choose Employee --</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Monthly Summary Input Form -->
    <div class="card p-4">
        <h4 class="fw-bold text-dark mb-4"><i class="fa-solid fa-file-pen me-2"></i>Monthly Summary Entry</h4>
        
        <form id="monthlyForm" onsubmit="saveMonthlyData(event)">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Total Worked Days / Present Days</label>
                    <input type="number" id="totalDays" class="form-control" placeholder="e.g. 25" step="0.5" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Total OT Hours</label>
                    <input type="number" id="totalOt" class="form-control" placeholder="e.g. 10" step="0.1" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Total Allowances (LKR)</label>
                    <input type="number" id="totalAllowances" class="form-control" placeholder="0.00" step="0.01">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Total Advance (LKR)</label>
                    <input type="number" id="totalAdvance" class="form-control" placeholder="0.00" step="0.01">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Total Loan Deduction (LKR)</label>
                    <input type="number" id="totalLoan" class="form-control" placeholder="0.00" step="0.01">
                </div>
                
                <div class="col-12 text-end mt-4">
                    <button type="submit" class="btn btn-success btn-lg btn-custom px-5">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Monthly Details
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://rukman-payroll-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    let employeesData = {};
    let allAttendanceData = {};

    document.getElementById('attMonth').value = new Date().toISOString().slice(0, 7);

    // Fetch Employees
    database.ref('employees').on('value', (snapshot) => {
        employeesData = snapshot.val() || {};
        populateEmpDropdown();
    });

    // Fetch Attendance / Monthly data
    database.ref('attendance').on('value', (snapshot) => {
        allAttendanceData = snapshot.val() || {};
        loadMonthlyData();
    });

    function populateEmpDropdown() {
        const select = document.getElementById('attEmpSelect');
        const currVal = select.value;
        select.innerHTML = '<option value="">-- Choose Employee --</option>';

        let sortedList = Object.keys(employeesData).map(k => ({ key: k, ...employeesData[k] }));
        sortedList.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

        sortedList.forEach(emp => {
            const empIdStr = String(emp.id || emp.key).trim();
            select.innerHTML += `<option value="${empIdStr}">${emp.name} (${empIdStr}) - ${emp.branch || ''}</option>`;
        });

        select.value = currVal;
    }

    function loadMonthlyData() {
        const month = document.getElementById('attMonth').value;
        const empId = document.getElementById('attEmpSelect').value;

        // Reset form fields
        document.getElementById('totalDays').value = '';
        document.getElementById('totalOt').value = '';
        document.getElementById('totalAllowances').value = '';
        document.getElementById('totalAdvance').value = '';
        document.getElementById('totalLoan').value = '';

        if (!month || !empId) return;

        const attKey = `${empId}_${month}`;
        const record = allAttendanceData[attKey];

        if (record) {
            document.getElementById('totalDays').value = record.totalDays || '';
            document.getElementById('totalOt').value = record.totalOt || '';
            document.getElementById('totalAllowances').value = record.totalAllowances || '';
            document.getElementById('totalAdvance').value = record.totalAdvance || '';
            document.getElementById('totalLoan').value = record.totalLoan || '';
        }
    }

    function saveMonthlyData(event) {
        event.preventDefault();

        const month = document.getElementById('attMonth').value;
        const empId = document.getElementById('attEmpSelect').value;

        if (!month || !empId) {
            alert('කරුණාකර පළමුව Month සහ Employee තෝරන්න!');
            return;
        }

        const totalDays = parseFloat(document.getElementById('totalDays').value) || 0;
        const totalOt = parseFloat(document.getElementById('totalOt').value) || 0;
        const totalAllowances = parseFloat(document.getElementById('totalAllowances').value) || 0;
        const totalAdvance = parseFloat(document.getElementById('totalAdvance').value) || 0;
        const totalLoan = parseFloat(document.getElementById('totalLoan').value) || 0;

        const attKey = `${empId}_${month}`;

        const summaryData = {
            totalDays,
            totalOt,
            totalAllowances,
            totalAdvance,
            totalLoan
        };

        database.ref(`attendance/${attKey}`).set(summaryData).then(() => {
            alert('මාසික දත්ත සාර්ථකව Save විය!');
        }).catch((error) => {
            alert('දෝෂයක් ඇති විය: ' + error.message);
        });
    }
</script>

</body>
</html>
