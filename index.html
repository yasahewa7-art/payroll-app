<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration - Payroll App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-custom { border-radius: 6px; font-weight: 500; }
        .table-dark-custom { background-color: #0f172a; color: white; }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- Header with Navigation Button -->
    <div class="card header-bg p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h2 class="fw-bold mb-1"><i class="fa-solid fa-users me-2"></i>Employee Registration</h2>
                <p class="mb-0 text-light opacity-75">Matara & Weligama Branches</p>
            </div>
            <div class="mt-3 mt-md-0 d-flex gap-2">
                <a href="attendance.html" class="btn btn-warning btn-custom text-dark fw-bold">
                    <i class="fa-solid fa-calendar-check me-2"></i>Go to Attendance Sheet
                </a>
            </div>
        </div>
    </div>

    <!-- Registration Form -->
    <div class="card p-4 mb-4">
        <h4 class="fw-bold text-dark mb-3"><i class="fa-solid fa-user-plus me-2"></i>Add / Edit Employee</h4>
        <form id="empForm" onsubmit="saveEmployee(event)">
            <input type="hidden" id="editIndex" value="-1">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Employee ID *</label>
                    <input type="text" id="empId" class="form-control" placeholder="EMP-001" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Employee Name *</label>
                    <input type="text" id="empName" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Branch *</label>
                    <select id="empBranch" class="form-select" required>
                        <option value="">-- Select Branch --</option>
                        <option value="Matara">Matara</option>
                        <option value="Weligama">Weligama</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Basic Salary (LKR) *</label>
                    <input type="number" id="empSalary" class="form-control" placeholder="50000" step="0.01" required>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary btn-custom" onclick="resetForm()"><i class="fa-solid fa-rotate-left me-1"></i>Reset</button>
                    <button type="submit" class="btn btn-success btn-custom" id="submitBtn"><i class="fa-solid fa-floppy-disk me-1"></i>Save Employee</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Employee List Table -->
    <div class="card p-4">
        <h5 class="fw-bold mb-3">Registered Employees List</h5>
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center">
                <thead class="table-dark-custom">
                    <tr>
                        <th>EMP ID</th>
                        <th>NAME</th>
                        <th>BRANCH</th>
                        <th>BASIC SALARY (LKR)</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="empTableBody">
                    <tr><td colspan="5" class="text-muted py-4">තවමත් කිසිදු සේවකයෙකු ඇතුළත් කර නැත.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let employees = JSON.parse(localStorage.getItem('payroll_employees')) || [];

    function renderEmployees() {
        const tbody = document.getElementById('empTableBody');
        if (employees.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-muted py-4">තවමත් කිසිදු සේවකයෙකු ඇතුළත් කර නැත.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        employees.forEach((emp, index) => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${emp.id}</strong></td>
                    <td>${emp.name}</td>
                    <td><span class="badge ${emp.branch === 'Matara' ? 'bg-primary' : 'bg-info text-dark'}">${emp.branch}</span></td>
                    <td>${parseFloat(emp.salary).toLocaleString('en-US', {minimumFractionDigits: 2})} LKR</td>
                    <td>
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="editEmployee(${index})"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteEmployee(${index})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
        });
    }

    function saveEmployee(e) {
        e.preventDefault();
        const id = document.getElementById('empId').value.trim();
        const name = document.getElementById('empName').value.trim();
        const branch = document.getElementById('empBranch').value;
        const salary = parseFloat(document.getElementById('empSalary').value);
        const editIdx = parseInt(document.getElementById('editIndex').value);

        if (editIdx === -1) {
            if (employees.some(emp => emp.id === id)) {
                alert('මෙම ID එක සහිත සේවකයෙකු දැනටමත් ඇතුළත් කර ඇත!');
                return;
            }
            employees.push({ id, name, branch, salary });
        } else {
            employees[editIdx] = { id, name, branch, salary };
        }

        localStorage.setItem('payroll_employees', JSON.stringify(employees));
        resetForm();
        renderEmployees();
    }

    function editEmployee(index) {
        const emp = employees[index];
        document.getElementById('empId').value = emp.id;
        document.getElementById('empName').value = emp.name;
        document.getElementById('empBranch').value = emp.branch;
        document.getElementById('empSalary').value = emp.salary;
        document.getElementById('editIndex').value = index;
        document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-pen-to-square me-1"></i>Update Employee';
    }

    function deleteEmployee(index) {
        if (confirm('මෙම සේවකයාගේ තොරතුරු ඉවත් කිරීමට අවශ්‍යද?')) {
            employees.splice(index, 1);
            localStorage.setItem('payroll_employees', JSON.stringify(employees));
            renderEmployees();
        }
    }

    function resetForm() {
        document.getElementById('empForm').reset();
        document.getElementById('editIndex').value = -1;
        document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i>Save Employee';
    }

    // Initial Render
    renderEmployees();
</script>

</body>
</html>
