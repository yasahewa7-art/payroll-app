<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee & Payroll Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-dark-custom { background-color: #0f172a; color: white; }
        .btn-custom { border-radius: 6px; font-weight: 500; }
        @media print {
            .no-print { display: none !important; }
            .card { box-shadow: none; border: none; }
            body { background-color: white; }
        }
    </style>
</head>
<body>

<div class="container my-4">
    <!-- Header -->
    <div class="card header-bg p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h2 class="fw-bold mb-1"><i class="fa-solid fa-users-gear me-2"></i>Monthly Salary & Net Pay List</h2>
                <p class="mb-0 text-light opacity-75">රුක්මන් ඉංජිනියරින් (පෞද්ගලික) සමාගම - මාතර සහ වැලිගම ශාඛා</p>
            </div>
            <div class="no-print mt-3 mt-md-0 d-flex gap-2">
                <a href="attendance.html" class="btn btn-outline-light btn-custom"><i class="fa-solid fa-calendar-days me-2"></i>Attendance</a>
                <a href="salary.html" class="btn btn-outline-light btn-custom"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Payslip</a>
                <button class="btn btn-primary btn-custom" onclick="window.print()"><i class="fa-solid fa-print me-2"></i>Print Salary List</button>
            </div>
        </div>
    </div>

    <!-- Controls Section (Month Select & Branch Filter) -->
    <div class="card p-4 mb-4 no-print">
        <div class="row g-3 align-items-center">
            <div class="col-md-4">
                <label class="form-label fw-semibold"><i class="fa-solid fa-calendar-alt me-1"></i> Select Month *</label>
                <select id="selectedMonth" class="form-select" onchange="loadMonthData()">
                    <option value="January 2026">January 2026</option>
                    <option value="February 2026">February 2026</option>
                    <option value="March 2026">March 2026</option>
                    <option value="April 2026">April 2026</option>
                    <option value="May 2026">May 2026</option>
                    <option value="June 2026">June 2026</option>
                    <option value="July 2026">July 2026</option>
                    <option value="August 2026">August 2026</option>
                    <option value="September 2026" selected>September 2026</option>
                    <option value="October 2026">October 2026</option>
                    <option value="November 2026">November 2026</option>
                    <option value="December 2026">December 2026</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold"><i class="fa-solid fa-filter me-1"></i> Filter Branch</label>
                <select id="filterBranch" class="form-select" onchange="renderTable()">
                    <option value="All">All Branches</option>
                    <option value="Matara">Matara Branch</option>
                    <option value="Weligama">Weligama Branch</option>
                </select>
            </div>
            <div class="col-md-4 text-md-end mt-4">
                <button class="btn btn-success btn-custom w-100" onclick="saveAllSalaries()"><i class="fa-solid fa-floppy-disk me-2"></i>Save All Changes</button>
            </div>
        </div>
    </div>

    <!-- Table Section -->
    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-dark mb-0"><i class="fa-solid fa-list me-2"></i>Employee Net Pay List (<span id="displayMonthText">September 2026</span>)</h4>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle border">
                <thead class="table-dark-custom">
                    <tr>
                        <th style="width: 10%;">ID</th>
                        <th style="width: 25%;">NAME</th>
                        <th style="width: 15%;">BRANCH</th>
                        <th style="width: 25%;">NET PAY SALARY (LKR)</th>
                        <th style="width: 25%;">SIGNATURE (අත්සන)</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Firebase SDK Integrations -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // Firebase Config Options
    const firebaseConfig = {
        databaseURL: "https://rukman-payroll-default-rtdb.firebaseio.com"
    };
    
    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    
    let employees = {};
    let monthlySalaries = {};

    // Load data from Firebase on startup
    function initApp() {
        // Fetch Employees
        database.ref('employees').on('value', (snapshot) => {
            employees = snapshot.val() || {};
            loadMonthData();
        });
    }

    // Load monthly net pay values when month changes
    function loadMonthData() {
        const month = document.getElementById('selectedMonth').value;
        document.getElementById('displayMonthText').innerText = month;
        
        // Sanitize month string to use as firebase key (replace spaces)
        const monthKey = month.replace(/\s+/g, '_');

        database.ref('monthlySalaries/' + monthKey).once('value', (snapshot) => {
            monthlySalaries = snapshot.val() || {};
            renderTable();
        });
    }

    // Render table with ID order
    function renderTable() {
        const tbody = document.getElementById('employeeTableBody');
        const filterBranch = document.getElementById('filterBranch').value;
        tbody.innerHTML = '';

        let empList = Object.keys(employees).map(key => ({
            key: key,
            ...employees[key]
        }));

        // Sort strictly by Numeric ID in ascending order (1, 2, 3... 10, 11...)
        empList.sort((a, b) => {
            const idA = Number(a.id || 0);
            const idB = Number(b.id || 0);
            return idA - idB;
        });

        if (filterBranch !== 'All') {
            empList = empList.filter(e => e.branch === filterBranch);
        }

        if (empList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">සේවක තොරතුරු කිසිවක් හමු නොවීය. (කරුණාකර මුල් පද්ධතිය හරහා සේවකයන් ඇතුළත් කරන්න)</td></tr>`;
            return;
        }

        empList.forEach((emp) => {
            // Get saved net pay for this employee in this month, default to 0
            const netPayVal = monthlySalaries[emp.key] !== undefined ? monthlySalaries[emp.key] : (emp.netPay || 0);

            tbody.innerHTML += `
                <tr>
                    <td><strong>${emp.id || ''}</strong></td>
                    <td>${emp.name || ''}</td>
                    <td><span class="badge ${emp.branch === 'Matara' ? 'bg-primary' : 'bg-info'}">${emp.branch || ''}</span></td>
                    <td>
                        <input type="number" step="0.01" class="form-control net-pay-input fw-semibold text-success" 
                               data-key="${emp.key}" value="${netPayVal}" placeholder="0.00">
                    </td>
                    <td style="border-bottom: 1px solid #dee2e6; height: 50px;"></td>
                </tr>
            `;
        });
    }

    // Save all net pay values for the selected month
    function saveAllSalaries() {
        const month = document.getElementById('selectedMonth').value;
        const monthKey = month.replace(/\s+/g, '_');
        const inputs = document.querySelectorAll('.net-pay-input');
        
        let updatedData = {};
        inputs.forEach(input => {
            const key = input.getAttribute('data-key');
            const val = parseFloat(input.value) || 0;
            updatedData[key] = val;
        });

        database.ref('monthlySalaries/' + monthKey).set(updatedData, (error) => {
            if (error) {
                alert('දත්ත සුරක්ෂිත කිරීමේදී දෝෂයක් ඇති විය!');
            } else {
                alert('මාසික වැටුප් දත්ත සාර්ථකව සුරකින ලදී!');
            }
        });
    }

    // Run initialization
    window.onload = initApp;
</script>

</body>
</html>
