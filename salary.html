<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // ----------------------------------------------------
    // SYSTEM PASSWORD CONFIGURATION
    // ----------------------------------------------------
    const SYSTEM_PASSWORD = "rukman123";

    // Check Login Status on Page Load
    document.addEventListener("DOMContentLoaded", function() {
        if (sessionStorage.getItem("isPayrollLoggedIn") === "true") {
            showMainSystem();
        } else {
            document.getElementById("loginModalOverlay").style.display = "flex";
            document.getElementById("mainContent").style.display = "none";
        }
    });

    function handleLogin(event) {
        event.preventDefault();
        const enteredPass = document.getElementById("inputPassword").value;
        const errElem = document.getElementById("loginErrorMsg");

        if (enteredPass === SYSTEM_PASSWORD) {
            sessionStorage.setItem("isPayrollLoggedIn", "true");
            errElem.classList.add("d-none");
            showMainSystem();
        } else {
            errElem.classList.remove("d-none");
        }
    }

    function showMainSystem() {
        document.getElementById("loginModalOverlay").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        initFirebaseApp();
    }

    function logoutSystem() {
        sessionStorage.removeItem("isPayrollLoggedIn");
        location.reload();
    }

    // ----------------------------------------------------
    // FIREBASE & PAYROLL LOGIC
    // ----------------------------------------------------
    let firebaseInitialized = false;
    let employeesData = {};
    let attendanceData = {};
    let currentEmpData = {};

    function initFirebaseApp() {
        if (firebaseInitialized) return;

        const firebaseConfig = {
            databaseURL: "https://rukman-payroll-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        document.getElementById('payMonth').value = new Date().toISOString().slice(0, 7);

        database.ref('employees').on('value', (snapshot) => {
            employeesData = snapshot.val() || {};
            populateEmpDropdown();
            renderAllData();
        });

        database.ref('attendance').on('value', (snapshot) => {
            attendanceData = snapshot.val() || {};
            renderAllData();
        });

        firebaseInitialized = true;
    }

    function populateEmpDropdown() {
        const select = document.getElementById('payEmpSelect');
        const currVal = select.value;
        select.innerHTML = '<option value="">-- Choose Employee --</option>';

        let sortedList = Object.keys(employeesData).map(k => ({ key: k, ...employeesData[k] }));
        sortedList.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

        sortedList.forEach(emp => {
            const empIdStr = String(emp.id || emp.key).trim();
            select.innerHTML += `<option value="${empIdStr}">${emp.name} (${empIdStr}) - ${emp.branch || ''}</option>`;
        });

        select.value = currVal;
    }

    function onMonthOrEmpChange() {
        calculateSalary();
        generateAllEmployeesSummary();
    }

    function renderAllData() {
        calculateSalary();
        generateAllEmployeesSummary();
    }

    function calculateSalary() {
        const month = document.getElementById('payMonth').value;
        const selectedEmpId = document.getElementById('payEmpSelect').value;

        if (!month || !selectedEmpId) {
            resetDisplay();
            return;
        }

        let empObj = null;
        Object.keys(employeesData).forEach(k => {
            const e = employeesData[k];
            if (String(e.id || k).trim() === String(selectedEmpId).trim()) {
                empObj = e;
            }
        });

        if (!empObj) {
            resetDisplay();
            return;
        }

        currentEmpData = empObj;

        const dailyRate = parseFloat(empObj.basic || empObj.dailyRate || 0);
        const rawEpfRate = empObj.epfBasic || empObj.epfDailyRate;
        const epfDailyRate = (rawEpfRate !== undefined && rawEpfRate !== null && rawEpfRate !== '' && parseFloat(rawEpfRate) > 0) ? parseFloat(rawEpfRate) : 0;
        
        // Fix: Index එකේ (Registration) දාන allowances අගය හරියටම ලබා ගැනීම
        const allowance = parseFloat(empObj.allowances || 0);

        document.getElementById('dispEmpName').innerText = empObj.name || '-';
        document.getElementById('dispEmpId').innerText = empObj.id || selectedEmpId;
        document.getElementById('dispBank').innerText = empObj.bankAcc || '-';
        document.getElementById('dispBranch').innerText = empObj.branch || '-';
        document.getElementById('dispPeriod').innerText = month;
        document.getElementById('dispDailyRate').innerText = dailyRate.toFixed(2);

        const attKey = `${selectedEmpId}_${month}`;
        const monthAtt = attendanceData[attKey] || {};

        let workedDays = 0;
        let totalOtHours = 0;
        let totalAdvance = 0;
        let totalLoan = 0;

        Object.keys(monthAtt).forEach(dateStr => {
            const dayData = monthAtt[dateStr];

            if (dayData.status === 'Present') {
                workedDays += 1;
            } else if (dayData.status === 'Half Day') {
                workedDays += 0.5;
            }

            totalOtHours += parseFloat(dayData.ot || 0);
            totalAdvance += parseFloat(dayData.advance || 0);
            totalLoan += parseFloat(dayData.loan || 0);
        });

        const basicTotal = workedDays * dailyRate;
        const hourlyRate = dailyRate > 0 ? (dailyRate / 8) : 0;
        const otTotal = hourlyRate * totalOtHours;

        let epf8Total = 0, epf12Total = 0, etf3Total = 0;

        if (epfDailyRate > 0) {
            const epfApplicableTotal = workedDays * epfDailyRate;
            epf8Total = epfApplicableTotal * 0.08;
            epf12Total = epfApplicableTotal * 0.12;
            etf3Total = epfApplicableTotal * 0.03;
        }

        const totalEarnings = basicTotal + otTotal + allowance;
        const totalDeductions = totalAdvance + epf8Total; 
        const netSalary = totalEarnings - totalDeductions;

        document.getElementById('dispDays').innerText = workedDays;
        document.getElementById('dispBasicTot').innerText = basicTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('dispOtHours').innerText = totalOtHours.toFixed(1);
        document.getElementById('dispOtTot').innerText = otTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('dispAllowanceTot').innerText = allowance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('dispTotalEarnings').innerText = totalEarnings.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('dispAdvanceTot').innerText = totalAdvance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('dispLoanTot').innerText = totalLoan.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('dispEpfTot').innerText = epf8Total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('dispTotalDeductions').innerText = totalDeductions.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('dispEpf12').innerText = epf12Total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('dispEtf3').innerText = etf3Total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('dispNetSalary').innerText = netSalary.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function generateAllEmployeesSummary() {
        const month = document.getElementById('payMonth').value;
        document.getElementById('sumPeriodText').innerText = month || '-';
        
        const tbody = document.getElementById('summaryTableBody');
        const tfoot = document.getElementById('summaryTableFoot');
        tbody.innerHTML = '';

        let keys = Object.keys(employeesData);
        if (keys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="13" class="text-center text-muted py-4">No Employee Data Found</td></tr>';
            tfoot.innerHTML = '';
            return;
        }

        let gBasic = 0, gOt = 0, gAllow = 0, gGross = 0;
        let gAdv = 0, gEpf = 0, gDed = 0, gNet = 0;

        keys.forEach(k => {
            const emp = employeesData[k];
            const empId = String(emp.id || k).trim();
            const dailyRate = parseFloat(emp.basic || emp.dailyRate || 0);
            const rawEpfRate = emp.epfBasic || emp.epfDailyRate;
            const epfDailyRate = (rawEpfRate !== undefined && rawEpfRate !== null && rawEpfRate !== '' && parseFloat(rawEpfRate) > 0) ? parseFloat(rawEpfRate) : 0;
            const allowance = parseFloat(emp.allowances || 0);

            const attKey = `${empId}_${month}`;
            const monthAtt = attendanceData[attKey] || {};

            let workedDays = 0, otHours = 0, advance = 0;

            Object.keys(monthAtt).forEach(dateStr => {
                const dayData = monthAtt[dateStr];
                if (dayData.status === 'Present') workedDays += 1;
                else if (dayData.status === 'Half Day') workedDays += 0.5;

                otHours += parseFloat(dayData.ot || 0);
                advance += parseFloat(dayData.advance || 0);
            });

            const basicTotal = workedDays * dailyRate;
            const hourlyRate = dailyRate > 0 ? (dailyRate / 8) : 0;
            const otTotal = hourlyRate * otHours;
            const grossPay = basicTotal + otTotal + allowance;

            let epf8 = 0;
            if (epfDailyRate > 0) {
                epf8 = (workedDays * epfDailyRate) * 0.08;
            }

            const totalDed = advance + epf8;
            const netPay = grossPay - totalDed;

            gBasic += basicTotal; gOt += otTotal; gAllow += allowance;
            gGross += grossPay; gAdv += advance; gEpf += epf8;
            gDed += totalDed; gNet += netPay;

            tbody.innerHTML += `
                <tr>
                    <td class="text-center fw-bold text-secondary">${empId}</td>
                    <td>
                        <div class="fw-bold text-dark">${emp.name || '-'}</div>
                        <small class="text-muted"><i class="fa-solid fa-location-dot me-1"></i>${emp.branch || '-'}</small>
                    </td>
                    <td class="text-end fw-semibold">${dailyRate.toFixed(2)}</td>
                    <td class="text-center"><span class="badge bg-light text-dark border">${workedDays} Days</span></td>
                    <td class="text-end fw-semibold">${basicTotal.toFixed(2)}</td>
                    <td class="text-center text-muted">${otHours.toFixed(1)}</td>
                    <td class="text-end">${otTotal.toFixed(2)}</td>
                    <td class="text-end">${allowance.toFixed(2)}</td>
                    <td class="text-end fw-bold text-success" style="background-color: #f0fdf4;">${grossPay.toFixed(2)}</td>
                    <td class="text-end text-danger">${advance.toFixed(2)}</td>
                    <td class="text-end text-danger">${epf8.toFixed(2)}</td>
                    <td class="text-end fw-bold text-danger" style="background-color: #fef2f2;">${totalDed.toFixed(2)}</td>
                    <td class="text-end fw-bold text-primary" style="background-color: #eff6ff;">${netPay.toFixed(2)}</td>
                </tr>
            `;
        });

        tfoot.innerHTML = `
            <tr>
                <td colspan="4" class="text-center text-uppercase">Grand Total (LKR)</td>
                <td>${gBasic.toFixed(2)}</td>
                <td>-</td>
                <td>${gOt.toFixed(2)}</td>
                <td>${gAllow.toFixed(2)}</td>
                <td class="text-success">${gGross.toFixed(2)}</td>
                <td class="text-warning">${gAdv.toFixed(2)}</td>
                <td class="text-warning">${gEpf.toFixed(2)}</td>
                <td class="text-danger">${gDed.toFixed(2)}</td>
                <td class="bg-primary text-white">${gNet.toFixed(2)}</td>
            </tr>
        `;
    }

    function resetDisplay() {
        document.getElementById('dispEmpName').innerText = '-';
        document.getElementById('dispEmpId').innerText = '-';
        document.getElementById('dispBank').innerText = '-';
        document.getElementById('dispBranch').innerText = '-';
        document.getElementById('dispPeriod').innerText = '-';
        document.getElementById('dispDailyRate').innerText = '0.00';
        document.getElementById('dispDays').innerText = '0';
        document.getElementById('dispBasicTot').innerText = '0.00';
        document.getElementById('dispOtHours').innerText = '0.0';
        document.getElementById('dispOtTot').innerText = '0.00';
        document.getElementById('dispAllowanceTot').innerText = '0.00';
        document.getElementById('dispTotalEarnings').innerText = '0.00';
        document.getElementById('dispAdvanceTot').innerText = '0.00';
        document.getElementById('dispLoanTot').innerText = '0.00';
        document.getElementById('dispEpfTot').innerText = '0.00';
        document.getElementById('dispTotalDeductions').innerText = '0.00';
        document.getElementById('dispEpf12').innerText = '0.00';
        document.getElementById('dispEtf3').innerText, document.getElementById('dispEtf3').innerText = '0.00';
        document.getElementById('dispNetSalary').innerText = '0.00';
    }

    function setPageOrientation(orientation) {
        let styleSheet = document.getElementById("printOrientationStyle");
        if (!styleSheet) {
            styleSheet = document.createElement("style");
            styleSheet.id = "printOrientationStyle";
            document.head.appendChild(styleSheet);
        }
        styleSheet.innerHTML = `@page { size: A4 ${orientation}; margin: 5mm; }`;
    }

    function printSinglePayslip() {
        const selectedEmpId = document.getElementById('payEmpSelect').value;
        if (!selectedEmpId) {
            alert('කරුණාකර පළමුව Single Payslip එක සඳහා සේවකයෙකු තෝරන්න!');
            return;
        }
        document.body.className = 'print-single';
        setPageOrientation('portrait');
        window.print();
    }

    function printSummarySheet() {
        document.body.className = 'print-summary';
        setPageOrientation('landscape');
        window.print();
    }
</script>
