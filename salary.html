<th>ID</th>
                        <th>NAME</th>
                        <th>BRANCH</th>
                        <th>BANK ACCOUNT</th>
                        <th>WHATSAPP</th>
                        <th>DAILY BASIC (LKR)</th>
                        <th>DAILY EPF (LKR)</th>
                        <th>ALLOWANCES (LKR)</th>
                        <th class="no-print text-center">ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let employees = JSON.parse(localStorage.getItem('payroll_employees')) || [];

    function saveEmployee(event) {
        event.preventDefault();
        
        const id = document.getElementById('empId').value.trim();
        const name = document.getElementById('empName').value.trim();
        const branch = document.getElementById('branch').value;
        const bankAcc = document.getElementById('bankAcc').value.trim() || '-';
        const whatsapp = document.getElementById('whatsapp').value.trim() || '-';
        const basic = parseFloat(document.getElementById('basicSalary').value) || 0;
        const epfBasic = parseFloat(document.getElementById('epfSalary').value) || 0;
        const allowances = parseFloat(document.getElementById('allowances').value) || 0;
        const editIndex = parseInt(document.getElementById('editIndex').value);

        const empData = { id, name, branch, bankAcc, whatsapp, basic, epfBasic, allowances };

        if (editIndex === -1) {
            employees.push(empData);
        } else {
            employees[editIndex] = empData;
        }

        saveAndRefresh();
        resetForm();
    }

    function renderTable() {
        const tbody = document.getElementById('employeeTableBody');
        const filterBranch = document.getElementById('filterBranch').value;
        tbody.innerHTML = '';

        // Sort A-Z
        let sortedEmployees = [...employees].sort((a, b) => a.name.localeCompare(b.name));

        if (filterBranch !== 'All') {
            sortedEmployees = sortedEmployees.filter(e => e.branch === filterBranch);
        }

        if (sortedEmployees.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-4">කිසිදු දත්තයක් ඇතුළත් කර නොමැත.</td></tr>`;
            return;
        }

        sortedEmployees.forEach((emp) => {
            const originalIndex = employees.findIndex(e => e.id === emp.id);
            tbody.innerHTML += `
                <tr>
                    <td><strong>${emp.id}</strong></td>
                    <td>${emp.name}</td>
                    <td><span class="badge ${emp.branch === 'Matara' ? 'bg-primary' : 'bg-info'}">${emp.branch}</span></td>
                    <td>${emp.bankAcc}</td>
                    <td>${emp.whatsapp}</td>
                    <td class="fw-semibold text-dark">${emp.basic.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    <td class="fw-semibold text-primary">${emp.epfBasic.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    <td>${emp.allowances.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    <td class="no-print text-center">
                        <button class="btn btn-sm btn-warning me-1" onclick="editEmployee(${originalIndex})" title="Edit"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="deleteEmployee(${originalIndex})" title="Delete"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    }

    function editEmployee(index) {
        const emp = employees[index];
        document.getElementById('empId').value = emp.id;
        document.getElementById('empName').value = emp.name;
        document.getElementById('branch').value = emp.branch;
        document.getElementById('bankAcc').value = emp.bankAcc === '-' ? '' : emp.bankAcc;
        document.getElementById('whatsapp').value = emp.whatsapp === '-' ? '' : emp.whatsapp;
        document.getElementById('basicSalary').value = emp.basic;
        document.getElementById('epfSalary').value = emp.epfBasic;
        document.getElementById('allowances').value = emp.allowances;
        document.getElementById('editIndex').value = index;

        document.getElementById('formTitle').innerText = 'Edit Employee Details';
        document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-arrows-rotate me-2"></i>Update Details';
        document.getElementById('cancelBtn').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEmployee(index) {
        if (confirm('ඔබට විශ්වාසද මෙම සේවක තොරතුරු ඉවත් කිරීමට අවශ්‍ය බව?')) {
            employees.splice(index, 1);
            saveAndRefresh();
        }
    }

    function resetForm() {
        document.getElementById('payrollForm').reset();
        document.getElementById('editIndex').value = '-1';
        document.getElementById('formTitle').innerText = 'Add New Employee Details';
        document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i>Save Details';
        document.getElementById('cancelBtn').classList.add('d-none');
    }

    function saveAndRefresh() {
        localStorage.setItem('payroll_employees', JSON.stringify(employees));
        renderTable();
    }

    // Initial Render
    renderTable();
</script>

</body>
</html>
