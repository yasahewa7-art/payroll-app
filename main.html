<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rukman Engineering - Main Dashboard</title>
  <style>
    /* Splash Screen Styling */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .splash-logo {
      width: 180px;
      height: auto;
      animation: pulse 1.5s infinite ease-in-out;
    }

    .splash-title {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
      font-family: Arial, sans-serif;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Main Dashboard UI */
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
    .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    h1 { color: #2c3e50; margin-bottom: 5px; }
    p.subtitle { color: #7f8c8d; margin-bottom: 30px; }

    /* Navigation Grid Buttons */
    .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .nav-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 25px 15px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      text-decoration: none;
      color: #333;
    }
    .nav-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      border-color: #28a745;
    }
    .nav-icon { font-size: 40px; margin-bottom: 10px; }
    .nav-title { font-size: 18px; font-weight: bold; color: #2c3e50; }
    .nav-desc { font-size: 13px; color: #666; margin-top: 5px; }

    .footer-brand { margin-top: 40px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 15px; }
  </style>
</head>
<body>

<!-- Splash Screen (Opens First with Logo) -->
<div id="splashScreen">
  <img src="logo.jpg" alt="Rukman Engineering Logo" class="splash-logo" onerror="this.src='https://via.placeholder.com/150?text=Rukman+Logo'">
  <div class="splash-title">Rukman Engineering (Pvt) Ltd</div>
</div>

<!-- Main Dashboard Container -->
<div class="container">
  <h1>Rukman Engineering (Pvt) Ltd</h1>
  <p class="subtitle">Payroll & Employee Management Portal</p>

  <div class="nav-grid">
    <!-- Button 1: Salary Calculation -->
    <a href="index.html" class="nav-card">
      <div class="nav-icon">💵</div>
      <div class="nav-title">Salary Management</div>
      <div class="nav-desc">Calculate salaries, advances, & print payslips</div>
    </a>

    <!-- Button 2: Employee List (Optional/Future Page) -->
    <a href="attendance.html" class="nav-card">
      <div class="nav-title">Employee Details</div>
      <div class="nav-desc">Manage employee profiles and records</div>
    </a>

    <!-- Button 3: Main / Index Page -->
    <a href="index.html" class="nav-card">
      <div class="nav-icon">🏠</div>
      <div class="nav-title">Home Portal</div>
      <div class="nav-desc">Return to main index home page</div>
    </a>
  </div>

  <div class="footer-brand">
    Designed & Developed by NUVIA Labs
  </div>
</div>

<script>
  // Hide Splash Screen after 2.5 Seconds
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      splash.style.opacity = '0';
      splash.style.visibility = 'hidden';
    }, 2500);
  });
</script>

</body>
</html>
